<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca SEMA - MPDFT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --mp-red: #C62828; --mp-gray: #37474F; --mp-light: #f4f4f4; --mp-blue: #1565C0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--mp-light); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: var(--mp-red); text-align: center; border-bottom: 2px solid var(--mp-red); padding-bottom: 10px; margin-bottom: 20px; font-size: 22px; }
        .status-bar { font-size: 12px; color: #666; text-align: center; margin-bottom: 20px; padding: 10px; background: #eee; border-radius: 4px; border: 1px solid #ccc; }
        
        .filters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        input, select { padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box; }
        input:focus { border-color: var(--mp-red); }

        .result-card { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; background: #fff; overflow: hidden; }
        .card-header { background: #f8f9fa; padding: 15px; border-bottom: 1px solid #eee; }
        .card-header h3 { margin: 0; color: var(--mp-gray); font-size: 18px; }
        
        .card-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .section { padding: 10px; border-radius: 6px; }
        .section-encaminhamento { border-left: 4px solid var(--mp-red); background: #fff5f5; }
        .section-credenciamento { border-left: 4px solid var(--mp-blue); background: #f0f7ff; }
        
        .section h4 { margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .section-encaminhamento h4 { color: var(--mp-red); }
        .section-credenciamento h4 { color: var(--mp-blue); }
        
        .area-list { font-size: 13px; color: #444; line-height: 1.4; margin-top: 5px; }
        
        .contact-info { grid-column: span 2; padding-top: 15px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-whatsapp { text-decoration: none; padding: 10px 20px; border-radius: 4px; color: white; font-weight: bold; background-color: #25D366; font-size: 14px; }
        
        @media (max-width: 768px) { 
            .filters { grid-template-columns: 1fr; } 
            .card-body { grid-template-columns: 1fr; }
            .contact-info { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Busca SEMA - Encaminhamento e Credenciamento</h1>
    <div id="status" class="status-bar">Sincronizando com a base de dados...</div>
    
    <div class="filters">
        <input type="text" id="searchTxt" placeholder="Busca por Promotoria..." onkeyup="filterData()">
        <input type="text" id="searchArea" placeholder="Busca por Bairro/Região..." onkeyup="filterData()">
        <select id="filterSema" onchange="filterData()">
            <option value="">Filtrar por SEMA</option>
        </select>
    </div>

    <div id="resultsList"></div>
</div>

<script>
    const SHEET_ID = '1hICJZHdYDwxCCCtXZ2ORmmiTOc_legGzJ82cYC_BVFk';
    const SHEET_NAME = '📍 Mapeamento';
    // Usando JSONP para evitar erros de conexão (CORS)
    let database = [];

    function googleSheetsCallback(response) {
        const statusEl = document.getElementById('status');
        try {
            const rows = response.table.rows;
            database = rows.map(row => ({
                pj: row.c[0] ? row.c[0].v : "",
                sema: row.c[1] ? row.c[1].v : "",
                whats: row.c[2] ? row.c[2].v : "",
                tel: row.c[3] ? row.c[3].v : "",
                area: row.c[4] ? row.c[4].v : "Área de credenciamento não informada"
            })).filter(item => item.pj && item.pj !== "Promotoria");

            statusEl.innerText = `✅ Sincronizado: ${database.length} registros carregados.`;
            setupFilters();
            renderResults(database);
        } catch (e) {
            statusEl.innerHTML = "<b style='color:red'>Erro ao processar dados. Verifique a aba '📍 Mapeamento'.</b>";
        }
    }

    function fetchData() {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:googleSheetsCallback&sheet=${encodeURIComponent(SHEET_NAME)}`;
        const script = document.createElement('script');
        script.src = url;
        document.body.appendChild(script);
    }

    function setupFilters() {
        const select = document.getElementById('filterSema');
        const semas = [...new Set(database.map(item => item.sema))].filter(s => s).sort();
        select.innerHTML = '<option value="">Todos os SEMAs</option>';
        semas.forEach(sema => {
            const option = document.createElement('option');
            option.value = sema; option.textContent = sema;
            select.appendChild(option);
        });
    }

    function renderResults(data) {
        const list = document.getElementById('resultsList');
        list.innerHTML = data.length ? '' : '<p style="text-align:center;color:#888;">Nenhum registro encontrado.</p>';
        data.forEach(item => {
            list.innerHTML += `
                <div class="result-card">
                    <div class="card-header"><h3>${item.pj}</h3></div>
                    <div class="card-body">
                        <div class="section section-encaminhamento">
                            <h4>Encaminhamento</h4>
                            <strong>${item.sema}</strong>
                            <div style="font-size:12px; color:#666; margin-top:5px;">Responsável por receber a medida desta Promotoria.</div>
                        </div>
                        <div class="section section-credenciamento">
                            <h4>Credenciamento de Instituições</h4>
                            <div class="area-list">
                                <strong>Regiões Atendidas:</strong><br>${item.area}
                            </div>
                        </div>
                        <div class="contact-info">
                            <span><strong>Telefone:</strong> ${item.tel}</span>
                            <a href="${item.whats}" target="_blank" class="btn-whatsapp">Falar no WhatsApp</a>
                        </div>
                    </div>
                </div>`;
        });
    }

    function filterData() {
        const txt = document.getElementById('searchTxt').value.toLowerCase();
        const areaTxt = document.getElementById('searchArea').value.toLowerCase();
        const semaFilter = document.getElementById('filterSema').value;

        const filtered = database.filter(item => {
            const matchTxt = !txt || item.pj.toLowerCase().includes(txt);
            const matchArea = !areaTxt || item.area.toLowerCase().includes(areaTxt);
            const matchSema = !semaFilter || item.sema === semaFilter;
            return matchTxt && matchArea && matchSema;
        });
        renderResults(filtered);
    }

    fetchData();
</script>
</body>
</html>
